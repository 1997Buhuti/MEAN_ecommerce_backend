# Nginx configuration for MEAN Ecommerce Backend
# Optimized for Oracle Cloud Free Tier AMD Micro (1 OCPU, 1 GB RAM)

# Rate limiting zone (optional basic protection: 10 req/s per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. api.yourdomain.com) or keep _ for IP access

    # Max body size for file uploads (covers product images via multer)
    client_max_body_size 20M;

    # Gzip compression to save bandwidth and speed up responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Direct static serving for uploads:
    # Serves images directly from disk via Nginx, bypassing Node.js to preserve RAM & CPU.
    location /public/uploads/ {
        alias /var/www/mean_ecommerce_backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        try_files $uri =404;
    }

    # 2. Health check endpoint (for monitoring/uptime checks)
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 3. Reverse proxy for API requests to PM2 Node process
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support & connection keep-alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for low-resource VM
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
